name: Toolkit CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  package-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON examples
        run: |
          python -m json.tool schemas/package-files.schema.json >/dev/null
          python -m json.tool examples/manifest.wordpress-plugin.json >/dev/null
      - name: Run package builder regression tests
        run: python -m unittest discover -s tests -v

