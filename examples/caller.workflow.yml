# Copy to .github/workflows/packages.yml in a consuming repository. Keep the
# reusable workflow and toolkit-ref pinned to the same reviewed commit.
name: Package validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    uses: aminrk2001/ark-release-toolkit/.github/workflows/release.yml@252b73b6383061006483fb44da5f842c63e4a7d6
    with:
      manifest: tests/package-files.json
      toolkit-ref: 252b73b6383061006483fb44da5f842c63e4a7d6
